agents:
  director: {model: mock}
  librarian: {model: mock}
  explorer: {model: mock, model_pool: [mock]}
  critic: {model: mock}
  reviewer: {model: mock}
  task_designer: {model: mock}
  planner: {model: mock}
  experimenter: {model: mock}
  evaluator: {model: mock}
  visualizer: {model: mock}
  writer: {model: mock}
  podcaster: {model: mock}
  video_producer: {model: mock}
